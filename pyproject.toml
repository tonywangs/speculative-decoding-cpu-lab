[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "specdecode-cpu-lab"
version = "0.1.0"
description = "Reproducible greedy speculative decoding experiments on a tiny CPU transformer"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch==2.8.0"]

[project.scripts]
specdecode = "specdecode.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
